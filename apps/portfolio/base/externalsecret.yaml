apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-server-env
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: portfolio-server-env
    creationPolicy: Owner
  data:
    - secretKey: DB_URL
      remoteRef:
        key: portfolio-server-db-url
    - secretKey: DB_USER
      remoteRef:
        key: portfolio-server-db-user
    - secretKey: DB_PW
      remoteRef:
        key: portfolio-server-db-pw
    - secretKey: JWT_SECRET
      remoteRef:
        key: portfolio-server-jwt-secret
